<div id="gt-lock"><div class="panel"><h2 style="color:#d9b66d">HairHouse GT StraightLAB</h2><p id="gt-status">パスワード設定を確認しています…</p><form id="gt-form" hidden><input id="gt-password" type="password" autocomplete="current-password" placeholder="共通パスワード" required><button type="submit">ログイン</button><p class="error" id="gt-error" aria-live="polite"></p></form></div></div>
<script>(async function(){const gate=document.getElementById('gt-lock'),status=document.getElementById('gt-status'),form=document.getElementById('gt-form'),error=document.getElementById('gt-error');const KEY='gt-straightlab-session-hash-v1';let cfg;try{const r=await fetch('./access-config.js?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('設定ファイルを読み込めません');const s=await r.text();const m=s.match(/GT_PASSWORD_SHA256\s*=\s*["']([a-f0-9]{64})["']/);if(!m)throw Error('設定が正しくありません');cfg=m[1];}catch(e){status.textContent='設定を確認できません。インターネット接続を確認して再読み込みしてください。';return;}if(localStorage.getItem(KEY)===cfg){gate.remove();return;}localStorage.removeItem(KEY);status.textContent='スタッフ用パスワードを入力してください';form.hidden=false;form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';const input=document.getElementById('gt-password');const b=new TextEncoder().encode(input.value);const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b))).map(v=>v.toString(16).padStart(2,'0')).join('');if(hash===cfg){localStorage.setItem(KEY,cfg);gate.remove();}else{error.textContent='パスワードが違います';input.value='';input.focus();}});})();</script></body></html>
