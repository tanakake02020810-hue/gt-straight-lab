<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9ddc8"><title>HairHouse GT | StraightLAB</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#332c26;background:#f7f3eb}*{box-sizing:border-box}body{margin:0}header{padding:22px 18px 18px;background:linear-gradient(135deg,#f5ede0,#e4d1b2);border-bottom:1px solid #d7c4a6}.wrap{max-width:880px;margin:auto}.brand{font-size:14px;letter-spacing:.13em}.brand b{font-size:23px;color:#8a6530}.hero{font-size:29px;letter-spacing:.08em;font-weight:700;margin:6px 0}.sub{font-size:12px;color:#76685b}.tabs{display:flex;gap:8px;overflow:auto;padding:14px 0;position:sticky;top:0;background:#f7f3eb;z-index:4}.tab{white-space:nowrap;background:#fff;border:1px solid #dfd4c4;padding:12px 17px;border-radius:18px;font-weight:700;color:#66584b}.tab.on{background:#3e342c;color:#fff;border-color:#3e342c}main{padding:0 15px 45px}.panel{background:#fff;border:1px solid #e6ddcf;border-radius:22px;padding:18px;margin:0 0 15px;box-shadow:0 6px 25px #69543d0c}.panel h2{font-size:18px;margin:0 0 14px}.hint{color:#827466;font-size:12px;line-height:1.6}.choices{display:flex;flex-wrap:wrap;gap:9px}.choice{border:1px solid #d9ccba;border-radius:13px;padding:11px 14px;background:#fbf8f3;color:#453b31;font-weight:600;cursor:pointer}.choice.selected{background:#e7d2a9;border-color:#a78447;box-shadow:inset 0 0 0 1px #b58c4c}label{display:block;font-size:13px;font-weight:700;margin:13px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #d8cabb;border-radius:11px;font-size:16px;background:#fff;color:#312c26}input[type=checkbox]{width:auto}button{cursor:pointer;font:inherit}.btn{background:#45392e;color:white;border:0;border-radius:12px;padding:13px 16px;font-weight:700}.btn.alt{background:#eee4d5;color:#42372d}.btn.warn{background:#f7e8e4;color:#943f31}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.result{border-radius:18px;background:#3b332d;color:#fff;padding:18px}.result .big{font-size:30px;color:#f4d89f;font-weight:800}.result .row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #716458;padding:10px 0}.muted{opacity:.8;font-size:12px}.error{color:#b33930;font-weight:700}.ok{color:#33784c}.small{font-size:12px}.hidden{display:none}.catalog{display:grid;gap:10px}.drug{border:1px solid #e1d7c8;border-radius:15px;padding:12px}.drug h3{margin:0 0 7px;font-size:15px}.drug .nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.drug .nums input{padding:9px;font-size:14px}.drug .nums label{font-size:11px;margin:0}.pill{font-size:11px;color:#80683e;background:#f3ead8;border-radius:20px;padding:3px 9px}.listitem{border-bottom:1px solid #eee4d7;padding:13px 0}.rowflex{display:flex;justify-content:space-between;align-items:center;gap:10px}.rowflex>*{min-width:0}.check{display:flex;align-items:center;gap:7px;font-weight:500}.check input{width:18px;height:18px}details{border-bottom:1px solid #e7dccc;padding:12px 0}summary{cursor:pointer;font-weight:700}@media(max-width:550px){.grid3{grid-template-columns:1fr 1fr}.hero{font-size:25px}.panel{padding:15px}.drug .nums{gap:5px}}@media print{.tabs,.actions,header,.no-print{display:none!important}.panel{box-shadow:none}body{background:#fff}}
</style></head><body><header><div class="wrap"><div class="brand">HairHouse <b>GT</b></div><div class="hero">STRAIGHT LAB.</div><div class="sub">Salon formula workspace · 再構築版</div></div></header><main class="wrap"><nav class="tabs" id="tabs"></nav><div id="page"></div></main><script>
'use strict';
const KEY='hhgt-straightlab-v2';
const init={diagnosis:{client:'',area:'根元',damage:'中',dry:'中',wet:'中',history:'なし',memo:''},brand:'ut-et',total:100,mode:'ratio',ratio:'1:1',items:[],records:[],catalog:{'ut-et':[],'HITA':[]}};
let state;try{const x=JSON.parse(localStorage.getItem(KEY)||'null');state={...structuredClone(init),...(x||{})};state.catalog={...init.catalog,...(x?.catalog||{})};if(!Array.isArray(state.records))state.records=[]}catch(e){state=structuredClone(init)}
let current='diagnosis';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('端末の保存容量が不足しています')}};
const pages=[['diagnosis','毛髪診断'],['formula','配合計算'],['catalog','薬剤登録'],['records','カルテ'],['guide','使い方']];function render(){ $('tabs').innerHTML=pages.map(([k,n])=>`<button class="tab ${k===current?'on':''}" data-tab="${k}">${n}</button>`).join('');$('page').innerHTML=({diagnosis:diagnosisPage,formula:formulaPage,catalog:catalogPage,records:recordsPage,guide:guidePage}[current])();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{current=b.dataset.tab;render()});bind()}
function choices(key,values){return `<div class="choices">${values.map(v=>`<button class="choice ${state.diagnosis[key]===v?'selected':''}" data-dkey="${key}" data-value="${esc(v)}">${esc(v)}</button>`).join('')}</div>`}
function diagnosisPage(){let d=state.diagnosis;return `<section class="panel"><h2>カウンセリング / 毛髪診断</h2><label>お客様名・識別名（任意）</label><input data-di="client" value="${esc(d.client)}" placeholder="例：A様"><label>施術部位</label>${choices('area',['根元','中間','毛先','全体'])}<label>ダメージレベル</label>${choices('damage',['低','中','高','非常に高い'])}<label>ドライ時のクセ</label>${choices('dry',['弱','中','強','非常に強い'])}<label>ウェット時のクセ</label>${choices('wet',['弱','中','強','非常に強い'])}<label>施術履歴</label>${choices('history',['なし','カラー','ブリーチ','縮毛矯正','複数履歴'])}<label>メモ</label><textarea data-di="memo" rows="3" placeholder="毛先の状態、注意点など">${esc(d.memo)}</textarea><div class="actions"><button class="btn" id="toFormula">配合計算へ進む →</button><button class="btn alt" id="saveRecord">診断内容をカルテ保存</button></div></section><section class="panel"><h2>診断の確認</h2><div class="hint">${esc(d.area)} ／ ダメージ：${esc(d.damage)} ／ ドライ時：${esc(d.dry)} ／ ウェット時：${esc(d.wet)} ／ 履歴：${esc(d.history)}</div><p class="hint">※この版では診断結果から薬剤を自動選定しません。元のut-et / HITA薬剤スペックを確認できていないため、安全のため自動提案を停止しています。</p></section>`}
function num(x){return Number.isFinite(Number(x))?Number(x):NaN}function calc(){const t=num(state.total),it=state.items;if(!Number.isFinite(t)||t<=0)return {error:'合計量は0より大きい数値を入力してください'};if(!it.length)return {error:'配合する薬剤を追加してください'};let w=[];if(state.mode==='ratio'){w=it.map(i=>num(i.part));if(w.some(v=>!Number.isFinite(v)||v<0)||w.every(v=>v===0))return {error:'比率には0以上の数値を設定してください（すべて0は不可）'}}else{w=it.map(i=>num(i.percent));if(w.some(v=>!Number.isFinite(v)||v<0)||w.every(v=>v===0))return {error:'割合には0以上の数値を設定してください'};if(Math.abs(w.reduce((a,b)=>a+b,0)-100)>0.001)return {error:'割合の合計を100%にしてください'}}const sum=w.reduce((a,b)=>a+b,0);const raw=w.map(x=>t*x/sum);const totalInt=Math.round(t);const floors=raw.map(Math.floor);let remain=totalInt-floors.reduce((a,b)=>a+b,0);const order=raw.map((v,i)=>({i,f:v-Math.floor(v)})).sort((a,b)=>b.f-a.f);let grams=[...floors];for(let j=0;j<remain;j++)grams[order[j%order.length].i]++;const specs=it.map(i=>state.catalog[state.brand].find(d=>d.id===i.id));let valid=specs.every(d=>d&&[d.tg,d.ac,d.ph].every(v=>v!==''&&Number.isFinite(num(v))));let weighted={};if(valid){for(let k of ['tg','ac'])weighted[k]=specs.reduce((a,d,i)=>a+num(d[k])*raw[i]/t,0)}return {raw,grams,totalInt,specs,weighted,valid,delta:totalInt-t}}
function formulaPage(){let c=calc();return `<section class="panel"><h2>配合計算</h2><div class="choices"><button class="choice ${state.brand==='ut-et'?'selected':''}" data-brand="ut-et">ut-et</button><button class="choice ${state.brand==='HITA'?'selected':''}" data-brand="HITA">HITA</button></div><div class="grid"><div><label>合計量 (g)</label><input id="total" type="number" min="1" step="1" value="${esc(state.total)}"></div><div><label>計算方式</label><select id="mode"><option value="ratio" ${state.mode==='ratio'?'selected':''}>比率</option><option value="percent" ${state.mode==='percent'?'selected':''}>割合 (%)</option></select></div></div><p class="hint">整数グラムに丸め、端数を調整して合計を一致させます。合計量が小数の場合は最も近い整数gに丸めます。</p><div id="formItems">${state.items.map((i,n)=>{let d=state.catalog[state.brand].find(x=>x.id===i.id);return `<div class="drug"><div class="rowflex"><strong>${n+1}. ${esc(d?.name||'未登録の薬剤')}</strong><button class="btn warn" data-remove="${n}">削除</button></div><div class="grid"><div><label>薬剤</label><select data-drug="${n}">${state.catalog[state.brand].map(x=>`<option value="${esc(x.id)}" ${i.id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div><label>${state.mode==='ratio'?'比率（例 2）':'割合（%）'}</label><input type="number" min="0" step="0.1" data-weight="${n}" value="${esc(state.mode==='ratio'?i.part:i.percent)}"></div></div></div>`}).join('')}</div><div class="actions"><button class="btn alt" id="addDrug">＋ 薬剤を追加</button><button class="btn alt" id="goCatalog">薬剤スペックを登録</button></div></section><section class="panel"><h2>計算結果</h2>${c.error?`<p class="error">${esc(c.error)}</p>`:`<div class="result"><div class="muted">整数gで計量する場合の合計</div><div class="big">${c.totalInt} g</div>${state.items.map((i,n)=>`<div class="row"><span>${esc(c.specs[n]?.name||'未登録')}</span><strong>${c.grams[n]} g</strong></div>`).join('')}</div><p class="hint">理論上の配合量：${c.raw.map((v,i)=>`${esc(c.specs[i]?.name||'?')} ${v.toFixed(2)}g`).join(' ／ ')}</p>${c.valid?`<p><strong>参考TG：${c.weighted.tg.toFixed(2)}%　参考AC：${c.weighted.ac.toFixed(2)}</strong></p><p class="hint">TG・ACは登録値の質量加重平均による概算です。pHは単純平均できないため表示しません。実測値やメーカー指示を優先してください。</p>`:'<p class="hint">薬剤のTG・AC・pHがすべて登録されると、TGとACの概算を表示します。</p>'}<div class="actions"><button class="btn" id="saveFormula">この配合をカルテ保存</button><button class="btn alt" id="print">印刷</button></div>`}</section>`}
function catalogPage(){let arr=state.catalog[state.brand];return `<section class="panel"><h2>薬剤マスター</h2><div class="choices"><button class="choice ${state.brand==='ut-et'?'selected':''}" data-brand="ut-et">ut-et</button><button class="choice ${state.brand==='HITA'?'selected':''}" data-brand="HITA">HITA</button></div><p class="hint">メーカー公表の薬剤名とTG・AC・pHを確認して入力してください。値が未確認のままなら空欄にしてください。登録データはこの端末に保存されます。</p><div class="catalog">${arr.map((d,n)=>`<div class="drug"><div class="rowflex"><h3>${n+1}. ${esc(d.name)}</h3><button class="btn warn" data-delcat="${esc(d.id)}">削除</button></div><label>薬剤名</label><input data-cat="${esc(d.id)}" data-field="name" value="${esc(d.name)}"><div class="nums">${[['tg','TG (%)'],['ac','AC'],['ph','pH']].map(([k,n])=>`<div><label>${n}</label><input data-cat="${esc(d.id)}" data-field="${k}" type="number" step="any" value="${esc(d[k])}"></div>`).join('')}</div></div>`).join('')}</div><div class="actions"><button class="btn" id="addCatalog">＋ 薬剤を登録</button><button class="btn alt" id="exportData">バックアップ保存</button><button class="btn alt" id="importData">バックアップ読込</button><input id="importFile" type="file" accept="application/json" class="hidden"></div></section>`}
function recordsPage(){return `<section class="panel"><h2>カルテ一覧</h2><p class="hint">この端末に保存されます。機種変更に備えて薬剤登録画面からバックアップしてください。</p>${state.records.length?state.records.map((r,n)=>`<div class="listitem"><div class="rowflex"><strong>${esc(r.client||'お客様名なし')}</strong><span class="pill">${esc(r.date)}</span></div><div class="small">${esc(r.area)} / ダメージ ${esc(r.damage)} / ${esc(r.brand||'診断のみ')}</div>${r.formula?`<div class="small">${esc(r.formula)}</div>`:''}<details><summary>診断メモ</summary><p>${esc(r.memo||'なし')}</p></details><button class="btn warn" data-delrec="${n}">この記録を削除</button></div>`).join(''):'<p>保存されたカルテはまだありません。</p>'}</section>`}
function guidePage(){return `<section class="panel"><h2>この再構築版について</h2><details open><summary>1. 毛髪診断</summary><p>部位、ダメージ、ドライ・ウェット時のクセ、施術履歴を選択。診断のみカルテ保存できます。</p></details><details><summary>2. 薬剤マスター登録</summary><p>ut-et / HITAそれぞれの薬剤名と、メーカー資料で確認したTG・AC・pHを登録します。未確認の数値は空欄のままにしてください。</p></details><details><summary>3. 配合計算</summary><p>薬剤を追加して比率または割合を入力します。整数グラムへの配分では最大剰余法を使用し、合計を一致させます。</p></details><details><summary>4. データ保存</summary><p>診断・薬剤・カルテは端末のブラウザに保存。ブラウザのデータ消去で消えることがあるため、バックアップを保存してください。</p></details><details><summary>5. 元のアプリとの違い</summary><p>元のソースコード・メーカー薬剤表を取得できていないため、以前の自動薬剤選定、詳細マニュアル、パスワード共有機能はまだ復元されていません。未検証の選定ロジックを実装したふりはしていません。</p></details></section>`}
function addRecord(formula=''){let d=state.diagnosis;state.records.unshift({...d,date:new Date().toLocaleString('ja-JP'),brand:formula?state.brand:'',formula});save();alert('カルテを保存しました')}
function download(name,contents,type){const b=new Blob([contents],{type});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function bind(){document.querySelectorAll('[data-dkey]').forEach(b=>b.onclick=()=>{state.diagnosis[b.dataset.dkey]=b.dataset.value;save();render()});document.querySelectorAll('[data-di]').forEach(el=>el.oninput=()=>{state.diagnosis[el.dataset.di]=el.value;save()});if($('toFormula'))$('toFormula').onclick=()=>{current='formula';render()};if($('saveRecord'))$('saveRecord').onclick=()=>addRecord();document.querySelectorAll('[data-brand]').forEach(b=>b.onclick=()=>{state.brand=b.dataset.brand;state.items=[];save();render()});if($('total'))$('total').onchange=e=>{state.total=e.target.value;save();render()};if($('mode'))$('mode').onchange=e=>{state.mode=e.target.value;save();render()};document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.items.splice(+b.dataset.remove,1);save();render()});document.querySelectorAll('[data-drug]').forEach(s=>s.onchange=()=>{state.items[+s.dataset.drug].id=s.value;save();render()});document.querySelectorAll('[data-weight]').forEach(i=>i.onchange=()=>{state.items[+i.dataset.weight][state.mode==='ratio'?'part':'percent']=i.value;save();render()});if($('addDrug'))$('addDrug').onclick=()=>{let a=state.catalog[state.brand];if(!a.length){alert('先に薬剤マスターに薬剤を登録してください');current='catalog';render();return}state.items.push({id:a[0].id,part:1,percent:0});save();render()};if($('goCatalog'))$('goCatalog').onclick=()=>{current='catalog';render()};if($('saveFormula'))$('saveFormula').onclick=()=>{let c=calc();if(c.error)return alert(c.error);addRecord(state.items.map((i,n)=>`${c.specs[n]?.name||'?'} ${c.grams[n]}g`).join(' / '))};if($('print'))$('print').onclick=()=>window.print();if($('addCatalog'))$('addCatalog').onclick=()=>{let name=prompt('薬剤名を入力してください');if(!name?.trim())return;state.catalog[state.brand].push({id:'d'+Date.now()+Math.random().toString(36).slice(2,7),name:name.trim(),tg:'',ac:'',ph:''});save();render()};document.querySelectorAll('[data-cat]').forEach(i=>i.onchange=()=>{let d=state.catalog[state.brand].find(x=>x.id===i.dataset.cat);if(d){d[i.dataset.field]=i.value;save();if(i.dataset.field==='name')render()}});document.querySelectorAll('[data-delcat]').forEach(b=>b.onclick=()=>{if(!confirm('この薬剤を削除しますか？'))return;state.catalog[state.brand]=state.catalog[state.brand].filter(d=>d.id!==b.dataset.delcat);state.items=state.items.filter(i=>i.id!==b.dataset.delcat);save();render()});document.querySelectorAll('[data-delrec]').forEach(b=>b.onclick=()=>{if(!confirm('このカルテを削除しますか？'))return;state.records.splice(+b.dataset.delrec,1);save();render()});if($('exportData'))$('exportData').onclick=()=>download('StraightLAB_backup.json',JSON.stringify(state,null,2),'application/json');if($('importData'))$('importData').onclick=()=>$('importFile').click();if($('importFile'))$('importFile').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x.catalog||!x.diagnosis||!Array.isArray(x.records))throw Error('形式が違います');if(confirm('現在の端末データをバックアップ内容で置き換えますか？')){state={...structuredClone(init),...x};save();render()}}catch(err){alert('読み込みに失敗しました：'+err.message)}}}
render();
</script></body></html>
