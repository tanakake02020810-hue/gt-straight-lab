function gtHitaManual(z){
 const inputLv=Math.max(1,Math.min(5,Number(z.damage)||1));
 const weak=Math.max(Number(z.dry)||0,Number(z.wet)||0);
 const curlCol=weak>=3?0:weak>=2?1:2;
 const history=z.history||'none';
 // Low-level color history corresponds at least to the manual's Lv2 color-hair page.
 // Lv3/4 require actual observed damage, not an automatic history-only escalation.
 const lv=history==='bleach'?5:history==='color'?Math.max(2,inputLv):inputLv;
 let row=z.texture==='ultraCoarse'?0:z.texture==='coarse'?1:z.texture==='normal'?2:z.texture==='fine'?3:4;
 if(z.water==='medium')row=Math.max(row,3);
 if(z.water==='strong')row=4;
 let code,tg,rec,source,notice='';
 if(history==='straight'){
  // RE page: columns are coarse / normal / fine, rows are diagnosed Lv1-5.
  const reCol=(z.texture==='ultraCoarse'||z.texture==='coarse')?0:z.texture==='normal'?1:2;
  const reLetters='PQR';
  code=reLetters[reCol]+'-'+lv;
  tg=GT_HITA_RE_GRID[0][lv-1][reCol];
  rec=GT_HITA_MANUAL_RECIPES[String(tg)];
  source='既矯正毛（再）';
  notice='既矯正部専用の「再」ページを参照。根元の新生部にはLv1〜5の通常表を使用してください。';
 }else{
  // Lv5 (bleach): the manual uses water-softening rows, NOT hair thickness.
  if(lv===5)row=z.water==='strong'?2:z.water==='medium'?1:0;
  const letters=['ABC','DEF','GHI','JKL','MNO'];
  code=letters[lv-1][curlCol]+'-'+(row+1);
  tg=GT_HITA_MANUAL_GRID[lv-1][row][curlCol];
  rec=GT_HITA_MANUAL_RECIPES[String(tg)];
  if(lv===1&&code==='A-1')rec=['EX',1,0];
  source='Lv'+lv+(history==='bleach'?'（ブリーチ毛）':'');
  if(history==='color')notice='カラー履歴：Lv2以上の表を参照。明度・頻度・実際の損傷状態に合わせてLv3/4を診断してください。';
  if(history==='bleach')notice='ブリーチ毛：Lv5専用表。水軟化チェックの結果で行を選択。水軟化（強）は施術見送りを優先。';
 }
 const direct=GT_HITA_NUMBER_RECIPES[(history==='straight'?'再':('Lv'+lv))+'|'+code];
 if(direct){
   const ratio=direct.ratio==='単剤'?[1,0]:direct.ratio.split(':').map(Number);
   if(ratio.length===2)rec=[direct.recipe,ratio[0],ratio[1]];
   tg=direct.tg;
 }
 if(!rec)throw Error('HITA manual recipe missing: '+code+' / '+tg);
 const total=Math.max(0,Number(z.total)||0);
 const den=rec[1]+rec[2];
 const a=den?total*rec[1]/den:0,b=den?total*rec[2]/den:0;
 const names=rec[0].split('：');
 const parts=rec[2]===0?[[names[0],total]]:[[names[0],a],[names[1],b]];
 return {code,tg,rec,parts,lv,col:curlCol,row,total,source,notice,
  stop:z.strength==='fragile'||total<=0||(history==='bleach'&&z.water==='strong')};
}


const original=[{name:'根元',dry:3,wet:2,texture:'coarse',damage:2,history:'none',water:'weak',strength:'good',total:80},{name:'中間',dry:2,wet:1,texture:'normal',damage:3,history:'straight',water:'medium',strength:'good',total:60},{name:'毛先',dry:1,wet:1,texture:'fine',damage:5,history:'bleach',water:'weak',strength:'good',total:40}];
function test(){const zs=structuredClone(original);const before=zs.map(gtHitaManual);zs[0].total=120;const after=zs.map(gtHitaManual);const independent=[1,2].every(i=>JSON.stringify(before[i])===JSON.stringify(after[i]));const weights=before.every(x=>Math.abs(x.parts.reduce((sum,p)=>sum+p[1],0)-x.total)<1e-7);const rootChanged=before[0].total!==after[0].total;const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('result').innerHTML='<section><h2 class="'+(independent&&weights&&rootChanged?'ok':'ng')+'">'+(independent&&weights&&rootChanged?'PASS：独立性と重量のチェック通過':'FAIL：チェック不一致')+'</h2><p>根元の総量 80g → 120g。中間・毛先は変更なし：'+(independent?'OK':'NG')+'</p><p>各部位の薬剤重量合計：'+(weights?'OK':'NG')+'</p><table><tr><th>部位</th><th>番号</th><th>総量</th><th>配合</th></tr>'+before.map((x,i)=>'<tr><td>'+original[i].name+'</td><td>'+escape(x.code)+'</td><td>'+x.total+'g</td><td>'+x.parts.map(p=>escape(p[0])+': '+p[1].toFixed(1)+'g').join(' / ')+'</td></tr>').join('')+'</table></section>';}document.getElementById('run').addEventListener('click',test);test();</script></html>
