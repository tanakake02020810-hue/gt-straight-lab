<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Straight Lab | 縮毛矯正ケミカル計算ツール</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <style>
    :root {
      --bg: #F9F8F6;
      --card-bg: #FFFFFF;
      --primary: #9C8379;
      --primary-light: #F4EFEA;
      --text-main: #333333;
      --text-sub: #777777;
      --accent-mint: #DDEBE6;
      --accent-pink: #F7E4E1;
      --border: #EFECE6;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 480px; width: 100%; }
    header { text-align: center; margin-bottom: 24px; padding-top: 10px; }
    .logo { font-size: 20px; font-weight: 600; letter-spacing: 2px; color: var(--primary); margin-bottom: 4px; text-transform: uppercase; }
    .subtitle { font-size: 12px; color: var(--text-sub); }
    .card { background: var(--card-bg); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
    .section-title { font-size: 14px; font-weight: 600; color: var(--primary); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }
    select, input[type="number"], input[type="text"] { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; background-color: var(--bg); outline: none; }
    select:focus, input:focus { border-color: var(--primary); background-color: #fff; }
    .radio-group { display: flex; gap: 8px; }
    .radio-btn { flex: 1; text-align: center; padding: 10px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; cursor: pointer; background: var(--bg); color: var(--text-sub); }
    .radio-btn.active { background: var(--primary-light); border-color: var(--primary); color: var(--primary); font-weight: 600; }
    .btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .result-box { background: var(--primary-light); border-radius: 12px; padding: 16px; margin-top: 10px; }
    .result-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; }
    .result-row:last-child { margin-bottom: 0; }
    .result-val { font-weight: 600; color: var(--primary); }
    .note { font-size: 11px; color: var(--text-sub); line-height: 1.5; margin-top: 12px; background: var(--bg); padding: 10px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">Straight Lab</div>
      <div class="subtitle">L-アルギニン × 縮毛矯正剤 計算ガイド</div>
    </header>

    <div class="card">
      <div class="section-title">1. ベース剤・目的強度の設定</div>
      <div class="form-group">
        <label>ベース SOFT剤の量 (g)</label>
        <input type="number" id="baseAmount" value="100">
      </div>
      <div class="form-group">
        <label>目標強度の設定</label>
        <div class="radio-group" id="targetGroup">
          <div class="radio-btn active" onclick="setTarget('SOFT')">SOFT</div>
          <div class="radio-btn" onclick="setTarget('NATURAL')">NATURAL</div>
          <div class="radio-btn" onclick="setTarget('HARD')">HARD</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">2. 追加還元剤の選択</div>
      <div class="form-group">
        <label>追加生詰め還元剤</label>
        <select id="agentSelect" onchange="calculate()">
          <option value="cys30">Cシステアミンブースター (30%)</option>
          <option value="thioCys50">Cチオシステアミンブースター (50%)</option>
          <option value="thioAm50">チオグリコール酸アンモニウム (50%)</option>
          <option value="malCys30">Cマレインアシッドシステアミン (30%)</option>
        </select>
      </div>
    </div>

    <div class="card">
      <div class="section-title">3. 配合計算結果</div>
      <div class="result-box">
        <div class="result-row"><span>SOFTベース剤:</span><span class="result-val" id="resBase">100 g</span></div>
        <div class="result-row"><span>追加還元剤添加率:</span><span class="result-val" id="resRate">0 %</span></div>
        <div class="result-row"><span>追加還元剤量:</span><span class="result-val" id="resAgentG">0.0 g</span></div>
        <div class="result-row"><span>L-アルギニン目安:</span><span class="result-val" id="resArgG">0.0 g (0%)</span></div>
        <div class="result-row"><span>目標pH目安:</span><span class="result-val" id="resPh">SOFTと同等</span></div>
      </div>

      <div class="form-group" style="margin-top: 16px;">
        <label>実測 pH (調合後に測定して入力)</label>
        <input type="number" step="0.1" id="measuredPh" placeholder="例: 8.2">
      </div>

      <div class="note">
        ※L-アルギニンは還元剤ではなく「pH・パワー調整役」です。一括投入せず、少しずつ加えて実測pHを確認してください。
      </div>
    </div>
  </div>

  <script>
    let currentTarget = 'SOFT';

    const recipes = {
      cys30: { SOFT: { rate: 0, arg: 0, ph: 'SOFT同等' }, NATURAL: { rate: 4, arg: 1.0, ph: '8.0 ~ 8.3' }, HARD: { rate: 8, arg: 2.5, ph: '8.5 ~ 8.8' } },
      thioCys50: { SOFT: { rate: 0, arg: 0, ph: 'SOFT同等' }, NATURAL: { rate: 3, arg: 0.8, ph: '8.0 ~ 8.4' }, HARD: { rate: 6.5, arg: 2.0, ph: '8.5 ~ 8.9' } },
      thioAm50: { SOFT: { rate: 0, arg: 0, ph: 'SOFT同等' }, NATURAL: { rate: 3, arg: 1.0, ph: '8.3 ~ 8.6' }, HARD: { rate: 6.5, arg: 2.5, ph: '8.8 ~ 9.2' } },
      malCys30: { SOFT: { rate: 0, arg: 0, ph: 'SOFT同等' }, NATURAL: { rate: 4, arg: 0.8, ph: '7.8 ~ 8.2' }, HARD: { rate: 8, arg: 2.0, ph: '8.3 ~ 8.6' } }
    };

    function setTarget(target) {
      currentTarget = target;
      const btns = document.querySelectorAll('#targetGroup .radio-btn');
      btns.forEach(btn => {
        btn.classList.toggle('active', btn.innerText === target);
      });
      calculate();
    }

    function calculate() {
      const base = parseFloat(document.getElementById('baseAmount').value) || 0;
      const agent = document.getElementById('agentSelect').value;
      const data = recipes[agent][currentTarget];

      const agentG = base * (data.rate / 100);
      const argG = base * (data.arg / 100);

      document.getElementById('resBase').innerText = base + ' g';
      document.getElementById('resRate').innerText = data.rate + ' %';
      document.getElementById('resAgentG').innerText = agentG.toFixed(1) + ' g';
      document.getElementById('resArgG').innerText = argG.toFixed(1) + ' g (' + data.arg + '%)';
      document.getElementById('resPh').innerText = data.ph;
    }

    document.getElementById('baseAmount').addEventListener('input', calculate);
    calculate();
  </script>
</body>
</html>
